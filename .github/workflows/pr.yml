name: PR Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  id-token: write      # OIDC
  contents: read
  pull-requests: write # post plan comment

env:
  TF_VERSION: "1.8.5"
  TFLINT_VERSION: "v0.51.2"

jobs:
  # ─────────────────────────────────────────────
  # 1. Terraform fmt + validate
  # ─────────────────────────────────────────────
  fmt-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # ─────────────────────────────────────────────
  # 2. TFLint
  # ─────────────────────────────────────────────
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    needs: fmt-validate
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

  # ─────────────────────────────────────────────
  # 3. Checkov security scan
  # ─────────────────────────────────────────────
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    needs: fmt-validate

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: false  # fail the pipeline on any HIGH/CRITICAL finding

  # ─────────────────────────────────────────────
  # 4. Terraform Plan (posted as PR comment)
  # ─────────────────────────────────────────────
  plan:
    name: terraform plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: [tflint, checkov]
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', upper(matrix.env))] }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: |
          terraform plan -out=tfplan.binary -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}-${{ github.sha }}
          path: envs/${{ matrix.env }}/tfplan.binary
          retention-days: 7

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.env }}/plan.txt', 'utf8');
            const maxLen = 65000;
            const body = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncated)'
              : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${{ matrix.env }}\`\n\`\`\`hcl\n${body}\n\`\`\``
            });
