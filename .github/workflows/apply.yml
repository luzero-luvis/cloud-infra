# This workflow runs automatically when code is merged into the main branch.
# It actually CREATES or CHANGES real infrastructure in AWS.
# Think of it as the construction crew that builds what the architect (PR) approved.

name: Apply

on:
  # WHEN to run — only when someone merges a PR into main
  push:
    branches: [main]
    paths:
      - "envs/**"    # only if terraform environment files changed
      - "modules/**" # only if terraform module files changed

# PERMISSIONS — what this workflow is allowed to do
permissions:
  id-token: write # needed to get OIDC token to authenticate with AWS
  contents: read  # needed to read the repo code

# GLOBAL VARIABLES
env:
  TF_VERSION: "1.10.5" # which version of Terraform to use

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Apply to DEV environment
  # This runs first — always deploy to dev before prod
  # ───────────────────────────────────────────────────────────────────────────
  apply-dev:
    name: apply dev
    runs-on: ubuntu-latest  # fresh Linux machine provided by GitHub

    # "environment: dev" links this job to the GitHub Environment named "dev"
    # You can add optional reviewers here in GitHub Settings → Environments → dev
    environment: dev

    defaults:
      run:
        working-directory: envs/dev  # all commands run inside the envs/dev folder

    steps:
      # Download your repo code onto the runner machine
      - uses: actions/checkout@v4

      # Log into AWS using OIDC (no passwords, no access keys)
      # GitHub sends a signed token to AWS → AWS returns temporary credentials
      # These credentials expire in 1 hour automatically
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEV }} # IAM role ARN stored in GitHub Secrets
          aws-region: ${{ vars.AWS_REGION }}          # e.g. us-east-1

      # Install Terraform on the runner machine
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Connect to S3 backend and download the current state file
      # STATE_PASSPHRASE decrypts the state file (our passphrase encryption)
      - name: terraform init
        run: terraform init
        env:
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

      # Actually create/modify/delete resources in AWS dev account
      # -auto-approve  means do not ask "are you sure?" (we already approved via PR review)
      # -no-color      removes color codes so logs are clean
      # After this runs, the new state is saved back to S3 automatically
      - name: terraform apply
        env:
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
        run: terraform apply -auto-approve -no-color


  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Apply to PROD environment
  # Only starts AFTER dev apply succeeds (needs: apply-dev)
  # PAUSES and waits for a human to click "Approve" in GitHub before continuing
  # ───────────────────────────────────────────────────────────────────────────
  apply-prod:
    name: apply prod
    runs-on: ubuntu-latest
    needs: apply-dev  # wait for dev to finish successfully before starting prod

    # "environment: production" links to the GitHub Environment named "production"
    # In GitHub Settings → Environments → production → Required reviewers
    # The workflow PAUSES here until a human clicks Approve in GitHub UI
    environment: production

    defaults:
      run:
        working-directory: envs/prod  # all commands run inside the envs/prod folder

    steps:
      # Download your repo code onto the runner machine
      - uses: actions/checkout@v4

      # Log into AWS using OIDC — this time using the PROD role
      # The prod role trust policy only allows the main branch (not feature branches)
      # so even if someone tries to run this from a feature branch, AWS will reject it
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PROD }} # prod IAM role — stricter than dev
          aws-region: ${{ vars.AWS_REGION }}

      # Install Terraform on the runner machine
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Connect to S3 backend and download the prod state file
      - name: terraform init
        run: terraform init
        env:
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

      # Actually create/modify/delete resources in AWS prod account
      # This only runs after a human has clicked Approve in the GitHub UI
      - name: terraform apply
        env:
          TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
        run: terraform apply -auto-approve -no-color
