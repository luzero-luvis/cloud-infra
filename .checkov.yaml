# ─────────────────────────────────────────────────────────────────────────────
# CHECKOV CONFIGURATION
#
# Checkov is the security police for your Terraform code.
# It reads your .tf files BEFORE anything is created in AWS and asks:
# "Is this safe? Is this following security best practices?"
#
# Run locally: checkov -d . --config-file .checkov.yaml
# In CI/CD: this file is picked up automatically by the checkov-action in pr.yml
# ─────────────────────────────────────────────────────────────────────────────

# Which folders to scan
directory:
  - .  # scan the entire repo from the root

# Which types of files to scan
# Checkov supports many more (kubernetes, helm, dockerfile, etc.)
framework:
  - terraform       # scan .tf files
  - dockerfile      # scan Dockerfiles for security issues
  - github_actions  # scan .github/workflows/*.yml for dangerous patterns

# ── SKIP LIST ────────────────────────────────────────────────────────────────
# Some checks are valid security concerns in general but do not apply to us.
# Every skip must have a reason documented — future you will thank you.
skip-check:
  # CKV_AWS_144 — S3 cross-region replication
  # Reason: state buckets are not DR-critical enough to warrant the cost.
  - CKV_AWS_144

  # CKV2_AWS_62 — S3 event notifications
  # Reason: state buckets do not need event notifications.
  - CKV2_AWS_62

  # CKV_AWS_274 — AdministratorAccess policy
  # Reason: GitHub Actions roles intentionally use AdministratorAccess to allow
  # Terraform to create any resource. Scope down once permissions are known.
  - CKV_AWS_274

  # CKV_AWS_158 — CloudWatch log group KMS encryption
  # Reason: VPC flow logs contain network metadata, not secrets.
  # AES256 S3 encryption is sufficient; KMS adds cost and key management overhead.
  - CKV_AWS_158

  # CKV_AWS_145 — S3 KMS encryption
  # Reason: state buckets use AES256 (AWS-managed key) which is acceptable.
  # KMS adds per-request cost and key rotation complexity for state storage.
  - CKV_AWS_145

  # CKV_AWS_18 — S3 access logging
  # Reason: enabling access logging requires a separate logging bucket.
  # Adds circular dependency complexity for bootstrap state buckets.
  - CKV_AWS_18

  # CKV2_AWS_61 — S3 lifecycle configuration
  # Reason: state bucket old versions are managed via S3 versioning.
  # Lifecycle rules are not required for this use case.
  - CKV2_AWS_61

  # CKV2_AWS_6 — S3 public access block
  # Reason: false positive. Public access block is configured via the separate
  # aws_s3_bucket_public_access_block resource — Checkov does not correlate them.
  - CKV2_AWS_6

  # CKV_AWS_21 — S3 versioning
  # Reason: false positive. Versioning is enabled via the separate
  # aws_s3_bucket_versioning resource — Checkov does not correlate them.
  - CKV_AWS_21

# ── SEVERITY THRESHOLD ────────────────────────────────────────────────────────
# Only FAIL the pipeline when HIGH or CRITICAL issues are found.
# LOW and MEDIUM issues are still reported (you can see them in the log)
# but they do NOT block the PR.
# Why? LOW issues are often informational and not worth blocking work over.
hard-fail-on: HIGH,CRITICAL

# ── CUSTOM POLICIES ───────────────────────────────────────────────────────────
# Load our own security rules from the policies/ folder.
# These are rules Checkov does not have built-in — specific to our company.
# Example: "every resource must have an owner tag"
external-checks-dir:
  - policies/

# Show only failed checks (not the long list of passed checks).
# Makes the output much easier to read in GitHub Actions logs.
compact: true

# Output format — "cli" means human-readable text in the terminal.
output:
  - cli
